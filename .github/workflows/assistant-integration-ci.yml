name: Assistant Integration CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assistant-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate assistant source syntax
        run: |
          php -l app/Http/Controllers/AssistantMessageController.php
          php -l tests/Feature/AssistantMessageEndpointTest.php
      - name: Test assistant access and compatibility
        run: php artisan test --filter=AssistantMessageEndpointTest
