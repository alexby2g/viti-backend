name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  laravel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP syntax
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate database migrations
        run: php artisan migrate:fresh --force

      - name: Boot Laravel routes
        run: php artisan route:list --except-vendor

      - name: Run feature tests
        shell: bash
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/phpunit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 100 /tmp/phpunit.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PHPUnit failure::$details"
          fi
          exit "$status"
