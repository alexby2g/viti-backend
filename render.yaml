services:
  - type: web
    name: viti-core-api-alexby2g
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: America/La_Paz
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDER
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        value: viti-frontend.vercel.app
      - key: FRONTEND_URLS
        value: https://viti-frontend.vercel.app
      - key: FRONTEND_APP_URL
        value: https://viti-frontend.vercel.app
      - key: VITI_SETUP_SECRET
        sync: false
      - key: VITI_ADMIN_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Cloudflare R2. Primero carga credenciales; al final establece ambos drivers en s3.
      - key: PUBLIC_FILESYSTEM_DRIVER
        sync: false
      - key: PRIVATE_FILESYSTEM_DRIVER
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_PUBLIC_BUCKET
        value: viti-public
      - key: AWS_PRIVATE_BUCKET
        value: viti-private
      - key: AWS_PUBLIC_URL
        sync: false
